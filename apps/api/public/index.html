<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC 管理系统 - 原型</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <button class="theme-toggle-btn topbar-btn theme-toggle" onclick="toggleTheme()">🌙</button>
    <div class="entry-container">
        <div class="entry-header">
            <h1>RBAC 管理系统</h1>
            <p>基于角色的访问控制系统 · 高保真原型</p>
        </div>
        <div class="entry-cards">
            <div class="entry-card" onclick="navigateTo('web')">
                <div class="entry-icon">🌐</div>
                <h2>Web 管理后台</h2>
                <p>完整的RBAC管理界面，包含登录、仪表板、用户、角色、菜单、资源管理</p>
            </div>
            <div class="entry-card" onclick="navigateTo('uni')">
                <div class="entry-icon">📱</div>
                <h2>UniApp 移动端</h2>
                <p>移动端适配版本，优化了交互体验</p>
            </div>
        </div>
    </div>
    <div class="entry-footer">
        <p>参考设计风格：现代简约 · 专业SaaS风格</p>
    </div>
    <script src="js/common.js"></script>

</html>
